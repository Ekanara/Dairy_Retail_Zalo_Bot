[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Alembic reads DATABASE_URL from env via env.py — do NOT set sqlalchemy.url here
# to avoid committing credentials.
# sqlalchemy.url = (set in migrations/env.py from app.core.config)

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
