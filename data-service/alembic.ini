# Alembic configuration file — data-service
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Placeholder — overridden by env.py which reads from .env / environment variable
script_location = migrations
version_table = data_alembic_version
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5434/magic_sale

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
