version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TEI Reranker service
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: rag-tei-reranker
    ports:
      - "8005:80"
    volumes:
      - tei_data:/data
    environment:
      - MODEL_ID=BAAI/bge-reranker-v2-m3
      - REVISION=main
      - PORT=80
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --port
      - "80"
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # RAG service
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - TEI_RERANKER_URL=http://tei-reranker:80
      - SERVICE_PORT=8006
    depends_on:
      - qdrant
    networks:
      - rag-network
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8006", "--reload"]

volumes:
  qdrant_storage:
  tei_data:

networks:
  rag-network:
    driver: bridge
