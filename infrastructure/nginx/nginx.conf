# ============================================================
# nginx.conf — Magic Sale AI reverse proxy
# Production use: uncomment nginx service in docker-compose.yml
# ============================================================

upstream zalo_service {
    server zalo-service:8080;
    keepalive 32;
}

upstream models_service {
    server models-service:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Zalo Webhook — public, low timeout ───────────────────
    location /webhook {
        proxy_pass         http://zalo_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Public health check ───────────────────────────────────
    location /health {
        proxy_pass http://zalo_service;
        proxy_read_timeout 5s;
    }

    # ── Internal chat API — Docker/loopback only ──────────────
    # AI responses can be slow (streaming SSE) and should not be
    # reachable from the public internet.
    location /api/chat {
        # Allow only localhost and Docker bridge network
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny  all;

        proxy_pass            http://models_service/chat;
        proxy_set_header      Host            $host;
        proxy_set_header      X-Real-IP       $remote_addr;
        proxy_set_header      Connection      "";
        proxy_http_version    1.1;
        proxy_read_timeout    120s;   # AI response latency budget
        proxy_buffering       off;    # Required for SSE / streaming
        proxy_cache           off;
    }
}
